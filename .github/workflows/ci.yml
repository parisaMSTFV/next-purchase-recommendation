name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check public files
        run: python scripts/check_sensitive.py
      - name: Supplied-input smoke test
        run: >-
          python -m next_purchase.cli score
          --transactions examples/supplied_transactions_v1.csv
          --provenance examples/supplied_provenance_v1.json
          --score-date 2025-06-01
          --output-root /tmp/next-purchase-supplied
